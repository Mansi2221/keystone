name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, finish]

env:
  POSTGRES_USER: keystone
  POSTGRES_PASSWORD: keystone_dev_password
  POSTGRES_DB: keystone
  DATABASE_URL: postgresql://keystone:keystone_dev_password@localhost:5432/keystone

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint with ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run unit tests
        run: uv run pytest tests/unit/ -v --tb=short -m unit --junitxml=test-results.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: test-results.xml

  cerbos-policy-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Cerbos CLI
        run: |
          CERBOS_VERSION=$(curl -sI https://github.com/cerbos/cerbos/releases/latest | grep -i ^location: | sed 's|.*/v||;s/\r//')
          curl -sL "https://github.com/cerbos/cerbos/releases/download/v${CERBOS_VERSION}/cerbos_${CERBOS_VERSION}_Linux_x86_64.tar.gz" | tar xz

      - name: Run Cerbos policy tests
        run: ./cerbos compile policy/ --tests policy/tests/

  security-tests:
    runs-on: ubuntu-latest
    needs: [unit-tests]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: keystone
          POSTGRES_PASSWORD: keystone_dev_password
          POSTGRES_DB: keystone
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Initialize database (pgvector + app role)
        run: |
          PGPASSWORD=keystone_dev_password psql -h localhost -U keystone -d keystone -f company/sql/init.sql

      - name: Seed database
        run: uv run python -m company.seed
        env:
          DATABASE_URL: postgresql://keystone:keystone_dev_password@localhost:5432/keystone

      - name: Run deterministic security tests
        run: uv run pytest tests/security/ -v --tb=long -m security --junitxml=security-results.xml
        env:
          DATABASE_URL: postgresql://keystone:keystone_dev_password@localhost:5432/keystone

      - name: Upload security test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-test-results
          path: security-results.xml
