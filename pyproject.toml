[project]
name = "keystone"
version = "0.1.0"
description = "Permission-aware enterprise AI agent with full evaluation harness"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.14.0",
    "pgvector>=0.3.6",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.28.0",
    "faker>=33.0.0",
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.3.0",
    "langfuse>=2.0.0",
    "mcp>=1.0.0",
    "cerbos>=0.5.0",
    "streamlit>=1.40.0",
    "ragas>=0.2.0",
    "tiktoken>=0.8.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "testcontainers[postgres]>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["company", "agent", "api", "policy", "mcp_servers", "evals", "ui"]

[tool.ruff]
target-version = "py312"
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]
ignore = [
    "B008",   # function-call-in-default-argument (FastAPI Depends pattern)
    "B905",   # zip-without-explicit-strict (not needed for paired iterables)
    "E741",   # ambiguous-variable-name (a, b, c in Cohen's kappa)
    "SIM102", # collapsible-if (readability)
    "SIM105", # suppressible-exception (readability)
    "SIM108", # if-else-block-instead-of-if-exp (readability)
    "SIM113", # enumerate-for-loop (readability)
    "SIM117", # multiple-with-statements (readability)
    "E712",   # true-false-comparison (sqlalchemy filter patterns)
    "B904",   # raise-without-from-inside-except
    "F841",   # unused-variable (debugging temporaries)
    "B007",   # unused-loop-control-variable
    "SIM910", # dict-get-with-none-default
    "TC003",  # typing-only-standard-library-import
]
per-file-ignores = {"scripts/*" = ["E501"], "ui_streamlit/*" = ["E501"], "company/generators/*" = ["E501"]}

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests requiring database",
    "eval: Evaluation suite tests",
]
